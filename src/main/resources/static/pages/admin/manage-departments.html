<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Departments &mdash; SmartCare</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body>

  <div id="sc-navbar-slot"></div>

  <div class="dash-shell">
    <div id="sc-sidebar-slot"></div>

    <main class="dash-main">
      <div class="dash-header">
        <h2>Departments</h2>
        <button class="btn btn-primary" id="add-btn" type="button">Add department</button>
      </div>

      <form id="add-form" class="panel hidden mb-4" novalidate>
        <div class="form-group">
          <label for="dept-name">Name</label>
          <input class="form-control" id="dept-name" required>
        </div>
        <div class="form-group">
          <label for="dept-desc">Description</label>
          <textarea class="form-control" id="dept-desc" rows="2"></textarea>
        </div>
        <button class="btn btn-primary" type="submit">Save</button>
      </form>

      <table class="sc-table">
        <thead><tr><th>Name</th><th>Description</th><th>Doctors</th><th></th></tr></thead>
        <tbody id="dept-body"><tr><td colspan="4" class="text-muted">Loading&hellip;</td></tr></tbody>
      </table>
    </main>
  </div>

  <script>window.SC_BASE = '../../';</script>
  <script src="../../js/api.js"></script>
  <script src="../../js/utils.js"></script>
  <script src="../../js/layout.js"></script>
  <script>
    SmartCareUI.requireAuth(['ROLE_ADMIN']);

    document.getElementById('add-btn').addEventListener('click', () => {
      document.getElementById('add-form').classList.toggle('hidden');
    });

    function row(d) {
      return `
        <tr>
          <td>${SmartCareUI.escapeHtml(d.name)}</td>
          <td>${SmartCareUI.escapeHtml(d.description || '—')}</td>
          <td>${d.doctorCount}</td>
          <td><button class="btn btn-ghost btn-sm" data-remove="${d.id}">Deactivate</button></td>
        </tr>`;
    }

    async function load() {
      try {
        const departments = await SmartCareAPI.getDepartments();
        const body = document.getElementById('dept-body');
        body.innerHTML = departments.length
          ? departments.map(row).join('')
          : '<tr><td colspan="4" class="text-muted">No departments yet.</td></tr>';
        body.querySelectorAll('[data-remove]').forEach(btn => {
          btn.addEventListener('click', async () => {
            if (!confirm('Deactivate this department?')) return;
            await SmartCareAPI.deleteDepartment(btn.dataset.remove);
            load();
          });
        });
      } catch (err) {
        SmartCareUI.handleError(err, 'Could not load departments.');
      }
    }

    document.getElementById('add-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        await SmartCareAPI.createDepartment({
          name: document.getElementById('dept-name').value.trim(),
          description: document.getElementById('dept-desc').value.trim(),
        });
        document.getElementById('add-form').reset();
        document.getElementById('add-form').classList.add('hidden');
        SmartCareUI.toast('Department added.', 'success');
        load();
      } catch (err) {
        SmartCareUI.handleError(err, 'Could not add that department.');
      }
    });

    load();
  </script>
</body>
</html>
