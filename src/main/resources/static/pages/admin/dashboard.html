<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard &mdash; SmartCare</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body>

  <div id="sc-navbar-slot"></div>

  <div class="dash-shell">
    <div id="sc-sidebar-slot"></div>

    <main class="dash-main">
      <div class="dash-header">
        <h2>Hospital overview</h2>
      </div>

      <div class="panel-grid" id="kpi-grid">
        <p class="text-muted">Loading&hellip;</p>
      </div>

      <div class="mt-6">
        <a class="btn btn-outline" href="analytics.html">View full analytics &amp; charts</a>
      </div>
    </main>
  </div>

  <script>window.SC_BASE = '../../';</script>
  <script src="../../js/api.js"></script>
  <script src="../../js/utils.js"></script>
  <script src="../../js/layout.js"></script>
  <script>
    SmartCareUI.requireAuth(['ROLE_ADMIN']);

    function kpi(label, value, cls) {
      return `<div class="panel ${cls || ''}"><h4 class="mb-0">${value}</h4><p class="text-small text-muted mb-0">${label}</p></div>`;
    }

    async function load() {
      try {
        const d = await SmartCareAPI.getAdminDashboard();
        document.getElementById('kpi-grid').innerHTML = [
          kpi("Today's appointments", d.todaysAppointments),
          kpi('Completed today', d.completedAppointments, 'panel-green'),
          kpi('Cancelled today', d.cancelledAppointments, 'panel-brick'),
          kpi('Waiting in queue now', d.waitingPatients, 'panel-amber'),
          kpi('No-shows today', d.noShows, 'panel-brick'),
          kpi('Total doctors', d.totalDoctors),
          kpi('Total patients', d.totalPatients),
        ].join('');
      } catch (err) {
        SmartCareUI.handleError(err, 'Could not load the dashboard.');
      }
    }
    load();
  </script>
</body>
</html>
