<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Medical Timeline &mdash; SmartCare</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body>

  <div id="sc-navbar-slot"></div>

  <div class="dash-shell">
    <div id="sc-sidebar-slot"></div>

    <main class="dash-main">
      <h2>Medical timeline</h2>
      <div id="timeline"></div>
    </main>
  </div>

  <script>window.SC_BASE = '../../';</script>
  <script src="../../js/api.js"></script>
  <script src="../../js/utils.js"></script>
  <script src="../../js/layout.js"></script>
  <script>
    SmartCareUI.requireAuth(['ROLE_PATIENT']);

    function entryPanel(entry) {
      const kind = {
        CONSULTATION: 'panel-teal', DIAGNOSIS: 'panel-amber', PRESCRIPTION: 'panel-green',
        LAB_REQUEST: 'panel-quiet', LAB_REPORT: 'panel-quiet', APPOINTMENT: 'panel-quiet',
      }[entry.recordType] || 'panel-quiet';
      return `
        <div class="panel ${kind} mt-4">
          <div class="flex-between">
            <strong>${entry.recordType.replace('_', ' ')}</strong>
            <span class="text-small text-muted">${SmartCareUI.formatDate(entry.recordDate)}</span>
          </div>
          <p class="text-small text-muted mb-0">${SmartCareUI.escapeHtml(entry.description || '')}</p>
          ${entry.doctorName ? `<p class="text-small text-muted mb-0">Dr. ${SmartCareUI.escapeHtml(entry.doctorName)}</p>` : ''}
        </div>`;
    }

    async function load() {
      const params = new URLSearchParams(window.location.search);
      const familyMemberId = params.get('familyMemberId');
      try {
        let entries;
        if (familyMemberId) {
          entries = await SmartCareAPI.getFamilyMemberHistory(familyMemberId);
        } else {
          const patient = await SmartCareAPI.getMyPatientProfile();
          entries = await SmartCareAPI.getPatientMedicalHistory(patient.id);
        }
        const el = document.getElementById('timeline');
        el.innerHTML = entries.length
          ? entries.map(entryPanel).join('')
          : '<div class="empty-state">Nothing here yet. Your timeline fills in after your first appointment.</div>';
      } catch (err) {
        SmartCareUI.handleError(err, 'Could not load the timeline.');
      }
    }
    load();
  </script>
</body>
</html>
