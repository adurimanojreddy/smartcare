<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Find a Doctor &mdash; SmartCare</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body>

  <div id="sc-navbar-slot"></div>

  <div class="dash-shell">
    <div id="sc-sidebar-slot"></div>

    <main class="dash-main">
      <div class="dash-header">
        <div>
          <h2>Find a doctor</h2>
          <p class="text-muted mb-0">Not sure who to see? Tell us what's going on.</p>
        </div>
      </div>

      <div class="panel">
        <h4>What's bothering you?</h4>
        <p class="text-small text-muted">Enter a few symptoms, separated by commas (e.g. "skin rash, itching").</p>
        <form id="symptom-form" class="flex gap-3" style="flex-wrap:wrap;" novalidate>
          <input class="form-control" style="flex:1; min-width:240px;" id="symptom-input" placeholder="skin rash, itching, redness">
          <button class="btn btn-primary" type="submit">Suggest a department</button>
        </form>
        <div id="recommendation-result" class="mt-4"></div>
      </div>

      <h3 class="mt-6">Or search directly</h3>
      <form id="search-form" class="flex gap-3 mt-4" style="flex-wrap:wrap;" novalidate>
        <input class="form-control" style="max-width:260px;" id="search-name" placeholder="Doctor name">
        <input class="form-control" style="max-width:260px;" id="search-specialization" placeholder="Specialization">
        <button class="btn btn-outline" type="submit">Search</button>
      </form>

      <div id="doctors-grid" class="panel-grid mt-6"></div>
    </main>
  </div>

  <script>window.SC_BASE = '../../';</script>
  <script src="../../js/api.js"></script>
  <script src="../../js/utils.js"></script>
  <script src="../../js/layout.js"></script>
  <script>
    SmartCareUI.requireAuth(['ROLE_PATIENT']);

    function renderDoctors(doctors) {
      const grid = document.getElementById('doctors-grid');
      if (!doctors.length) {
        grid.innerHTML = '<div class="empty-state">No doctors match yet.</div>';
        return;
      }
      grid.innerHTML = doctors.map(d => `
        <div class="panel">
          <h4>Dr. ${SmartCareUI.escapeHtml(d.fullName)}</h4>
          <p class="text-small text-muted mb-0">${SmartCareUI.escapeHtml(d.specialization)} &middot; ${SmartCareUI.escapeHtml(d.departmentName || '')}</p>
          <a class="btn btn-outline btn-sm mt-4" href="book-appointment.html?doctorId=${d.id}">Book with Dr. ${SmartCareUI.escapeHtml(d.fullName)}</a>
        </div>
      `).join('');
    }

    document.getElementById('symptom-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const raw = document.getElementById('symptom-input').value.trim();
      if (!raw) return;
      const symptoms = raw.split(',').map(s => s.trim()).filter(Boolean);

      try {
        const rec = await SmartCareAPI.recommendDepartment(symptoms);
        const resultEl = document.getElementById('recommendation-result');
        resultEl.innerHTML = `
          <div class="disclaimer-banner">${SmartCareUI.escapeHtml(rec.disclaimer)}</div>
          <div class="panel panel-teal">
            <h4 class="mb-0">Suggested department: ${SmartCareUI.escapeHtml(rec.recommendedDepartmentName)}</h4>
            ${rec.earliestAvailableSlot ? `<p class="text-small text-muted">Earliest opening: ${new Date(rec.earliestAvailableSlot).toLocaleString()}</p>` : ''}
          </div>`;
        renderDoctors(rec.availableDoctors || []);
      } catch (err) {
        SmartCareUI.handleError(err, 'Could not get a recommendation right now.');
      }
    });

    document.getElementById('search-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        const doctors = await SmartCareAPI.searchDoctors({
          name: document.getElementById('search-name').value.trim(),
          specialization: document.getElementById('search-specialization').value.trim(),
        });
        renderDoctors(doctors);
      } catch (err) {
        SmartCareUI.handleError(err, 'Search failed.');
      }
    });
  </script>
</body>
</html>
