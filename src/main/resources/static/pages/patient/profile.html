<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile &mdash; SmartCare</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body>

  <div id="sc-navbar-slot"></div>

  <div class="dash-shell">
    <div id="sc-sidebar-slot"></div>

    <main class="dash-main" style="max-width: 560px;">
      <h2>My profile</h2>
      <form id="profile-form" novalidate>
        <div class="form-group">
          <label for="fullName">Full name</label>
          <input class="form-control" id="fullName">
        </div>
        <div class="flex gap-3">
          <div class="form-group" style="flex:1;">
            <label for="phone">Phone</label>
            <input class="form-control" id="phone">
          </div>
          <div class="form-group" style="flex:1;">
            <label for="bloodGroup">Blood group</label>
            <input class="form-control" id="bloodGroup" placeholder="O+">
          </div>
        </div>
        <div class="form-group">
          <label for="address">Address</label>
          <textarea class="form-control" id="address" rows="2"></textarea>
        </div>
        <div class="form-group">
          <label for="emergencyContact">Emergency contact</label>
          <input class="form-control" id="emergencyContact">
        </div>
        <button class="btn btn-primary" type="submit">Save changes</button>
      </form>
    </main>
  </div>

  <script>window.SC_BASE = '../../';</script>
  <script src="../../js/api.js"></script>
  <script src="../../js/utils.js"></script>
  <script src="../../js/layout.js"></script>
  <script>
    SmartCareUI.requireAuth(['ROLE_PATIENT']);
    let patientId = null;

    async function load() {
      try {
        const patient = await SmartCareAPI.getMyPatientProfile();
        patientId = patient.id;
        document.getElementById('fullName').value = patient.fullName || '';
        document.getElementById('phone').value = patient.phone || '';
        document.getElementById('bloodGroup').value = patient.bloodGroup || '';
        document.getElementById('address').value = patient.address || '';
        document.getElementById('emergencyContact').value = patient.emergencyContact || '';
      } catch (err) {
        SmartCareUI.handleError(err, 'Could not load your profile.');
      }
    }

    document.getElementById('profile-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        await SmartCareAPI.updatePatient(patientId, {
          fullName: document.getElementById('fullName').value.trim(),
          phone: document.getElementById('phone').value.trim(),
          bloodGroup: document.getElementById('bloodGroup').value.trim(),
          address: document.getElementById('address').value.trim(),
          emergencyContact: document.getElementById('emergencyContact').value.trim(),
        });
        SmartCareUI.toast('Profile updated.', 'success');
      } catch (err) {
        SmartCareUI.handleError(err, 'Could not save your profile.');
      }
    });

    load();
  </script>
</body>
</html>
