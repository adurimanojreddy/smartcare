<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Appointments &mdash; SmartCare</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body>

  <div id="sc-navbar-slot"></div>

  <div class="dash-shell">
    <div id="sc-sidebar-slot"></div>

    <main class="dash-main">
      <div class="dash-header">
        <h2>My appointments</h2>
        <a class="btn btn-primary" href="book-appointment.html">Book another</a>
      </div>

      <div id="appointments-list"></div>
    </main>
  </div>

  <script>window.SC_BASE = '../../';</script>
  <script src="../../js/api.js"></script>
  <script src="../../js/utils.js"></script>
  <script src="../../js/layout.js"></script>
  <script>
    SmartCareUI.requireAuth(['ROLE_PATIENT']);
    let patientId = null;

    function appointmentCard(a) {
      const canCancel = ['BOOKED', 'CONFIRMED'].includes(a.status);
      return `
        <div class="panel mt-4">
          <div class="flex-between">
            <div>
              <h4 class="mb-0">Dr. ${SmartCareUI.escapeHtml(a.doctorName)} &middot; ${SmartCareUI.escapeHtml(a.departmentName)}</h4>
              <p class="text-small text-muted mb-0">${SmartCareUI.formatDate(a.appointmentDate)} at ${SmartCareUI.formatTime(a.appointmentTime)}
                ${a.familyMemberName ? ' &middot; for ' + SmartCareUI.escapeHtml(a.familyMemberName) : ''}</p>
              <p class="text-small text-muted mb-0">Code: ${SmartCareUI.escapeHtml(a.appointmentCode)}</p>
            </div>
            <span class="badge ${SmartCareUI.statusBadgeClass(a.status)}">${a.status}</span>
          </div>
          <div class="flex gap-3 mt-4" style="flex-wrap:wrap; align-items:flex-start;">
            <img src="data:image/png;base64,${a.qrCodeImageBase64}" alt="QR code" width="90" height="90">
            <div class="flex gap-2" style="flex-wrap:wrap;">
              ${canCancel ? `<button class="btn btn-danger btn-sm" data-cancel="${a.id}">Cancel</button>` : ''}
              ${a.status === 'CHECKED_IN' ? `<a class="btn btn-outline btn-sm" href="live-queue.html?appointmentId=${a.id}">View queue</a>` : ''}
              ${a.status === 'COMPLETED' ? `<a class="btn btn-outline btn-sm" href="prescriptions.html?appointmentId=${a.id}">View prescription</a>` : ''}
            </div>
          </div>
        </div>`;
    }

    async function load() {
      try {
        const patient = await SmartCareAPI.getMyPatientProfile();
        patientId = patient.id;
        const appointments = await SmartCareAPI.getPatientAppointments(patientId);
        const list = document.getElementById('appointments-list');
        if (!appointments.length) {
          list.innerHTML = '<div class="empty-state">No appointments yet. <a href="book-appointment.html">Book your first one</a>.</div>';
          return;
        }
        list.innerHTML = appointments.map(appointmentCard).join('');
        list.querySelectorAll('[data-cancel]').forEach(btn => {
          btn.addEventListener('click', () => cancelAppointment(btn.dataset.cancel));
        });
      } catch (err) {
        SmartCareUI.handleError(err, 'Could not load your appointments.');
      }
    }

    async function cancelAppointment(id) {
      if (!confirm('Cancel this appointment?')) return;
      try {
        await SmartCareAPI.cancelAppointment(id, 'Cancelled by patient');
        SmartCareUI.toast('Appointment cancelled.', 'success');
        load();
      } catch (err) {
        SmartCareUI.handleError(err, 'Could not cancel this appointment.');
      }
    }

    load();
  </script>
</body>
</html>
