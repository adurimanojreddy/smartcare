<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact &mdash; SmartCare</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body>

  <div id="sc-navbar-slot"></div>

  <section class="section" style="max-width: 640px;">
    <h1>Contact</h1>
    <p class="text-muted">
      This is a demo project, so this form doesn't send anywhere &mdash; but
      here's what a real hospital's contact page would offer.
    </p>

    <div class="panel-grid mt-6">
      <div class="panel">
        <h4>General enquiries</h4>
        <p class="text-muted text-small mb-0">hello@smartcare.example &middot; +1 (555) 010-0142</p>
      </div>
      <div class="panel panel-brick">
        <h4>Medical emergency</h4>
        <p class="text-muted text-small mb-0">Call your local emergency number. Do not use this app for urgent or emergency care.</p>
      </div>
    </div>

    <form class="mt-6" id="contact-form" novalidate>
      <div class="form-group">
        <label for="name">Name</label>
        <input class="form-control" id="name" required>
      </div>
      <div class="form-group">
        <label for="message">Message</label>
        <textarea class="form-control" id="message" rows="4" required></textarea>
      </div>
      <button class="btn btn-primary" type="submit">Send message</button>
    </form>
  </section>

  <div id="sc-footer-slot"></div>

  <script>window.SC_BASE = '../../';</script>
  <script src="../../js/api.js"></script>
  <script src="../../js/utils.js"></script>
  <script src="../../js/layout.js"></script>
  <script>
    document.getElementById('contact-form').addEventListener('submit', (e) => {
      e.preventDefault();
      SmartCareUI.toast('Thanks - this demo form doesn\u2019t actually send, but yours would.', 'success');
      e.target.reset();
    });
  </script>
</body>
</html>
